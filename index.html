<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفتر المحاسبة</title><style>
*{box-sizing:border-box}body{margin:0;padding:0 14px 110px;background:#f2ecdd;font-family:Tahoma,Arial,sans-serif;color:#172b45}
header{max-width:760px;margin:0 auto 14px;padding:24px 18px 20px;border-radius:0 0 26px 26px;background:linear-gradient(130deg,#071a31,#174b7c 68%,#286da4);color:#fff}
header h1{margin:0 0 6px;font-size:23px}header p{margin:0;color:#d9e9f8;font-size:13px}
main{max-width:760px;margin:auto}
.card{background:#fff;border-radius:19px;padding:16px;margin:12px 0;box-shadow:0 8px 24px #173c6410}
.card b{font-size:17px}.small{color:#718096;font-size:12px;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;padding:10px 14px;border-radius:12px;font-weight:bold;cursor:pointer;font-family:inherit}
.btn-blue{background:#174675;color:#fff}.btn-gold{background:#e7b34d;color:#071a31}.btn-white{background:#eef2f7;color:#172b45}.btn-green{background:#1a9a5a;color:#fff}.btn-red{background:#e05252;color:#fff}
.big{font-size:22px;font-weight:bold}.goldBig{width:100%;background:#e7b34d;color:#071a31;border:0;padding:15px;border-radius:16px;font-size:17px;font-weight:bold;margin-top:12px}
input,select,textarea{width:100%;padding:12px;border:1px solid #dce6f2;border-radius:12px;margin:7px 0;font-family:inherit;font-size:15px}
.bar{height:12px;background:#eef2f7;border-radius:20px;overflow:hidden;margin:6px 0}.fill{height:100%;background:#e7b34d}
.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eef2f7}
nav{position:fixed;bottom:12px;left:12px;right:12px;max-width:760px;margin:auto;background:#fff;border-radius:30px;display:flex;justify-content:space-around;align-items:center;padding:8px 6px;box-shadow:0 10px 30px #00000020;z-index:50}
.navBtn{background:none;border:0;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#888;cursor:pointer;font-family:inherit}.navBtn.active{color:#071a31;font-weight:bold}
.plusBtn{background:#e7b34d;width:58px;height:58px;border-radius:50%;font-size:32px;line-height:1;margin-top:-32px;border:4px solid #f2ecdd;box-shadow:0 8px 18px #e7b34d66}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center;z-index:99}.modal.open{display:flex}
.box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}
</style></head><body>
<header><h1>📒 دفتر المحاسبة</h1><p>إدارة الحسابات والمحلات — كل شي بمحلو</p></header>
<main>
<div id="view-home" class="view"></div>
<div id="view-shops" class="view" style="display:none"></div>
<div id="view-reports" class="view" style="display:none"></div>
<div id="view-settings" class="view" style="display:none"></div>
<div id="ledgerView" style="display:none"></div>
</main>

<div id="plusModal" class="modal"><div class="box">
<b style="font-size:18px">شو بدك تعمل؟</b>
<button class="goldBig" onclick="closePlus();openAddShop()">➕ زيد محل جديد</button>
<button class="goldBig" style="background:#174675;color:#fff" onclick="closePlus();openQuickTx('debt')">📝 سجل دين جديد</button>
<button class="goldBig" style="background:#1a9a5a;color:#fff" onclick="closePlus();openQuickTx('pay')">💰 سجل دفعة قبضتها</button>
<button class="btn btn-white" style="width:100%;margin-top:10px" onclick="closePlus()">إلغاء</button>
</div></div>

<div id="formModal" class="modal"><div class="box" id="formBox"></div></div>

<nav>
<button class="navBtn active" id="nav-home" onclick="showView('home')">🏠<span>الرئيسية</span></button>
<button class="navBtn" id="nav-shops" onclick="showView('shops')">📖<span>المحلات</span></button>
<button class="plusBtn" onclick="openPlus()">+</button>
<button class="navBtn" id="nav-reports" onclick="showView('reports')">📊<span>التقارير</span></button>
<button class="navBtn" id="nav-settings" onclick="showView('settings')">⚙️<span>الاعدادات</span></button>
</nav>

<script>
var shops=JSON.parse(localStorage.getItem('daftar_v3')||'null');
if(!shops){shops=[];for(var i=1;i<=10;i++){shops.push({id:'shop'+i,name:'محل '+i,phone:'',tx:[]})}save();}
function save(){localStorage.setItem('daftar_v3',JSON.stringify(shops))}
function fmt(n){return Number(n||0).toLocaleString('en-US')}
function total(s){return s.tx.reduce(function(a,t){return a+(t.type=='debt'?t.amount:-t.amount)},0)}
function todayStr(){return new Date().toISOString().slice(0,10)}
function collectedToday(){var sum=0;shops.forEach(function(s){s.tx.forEach(function(t){if(t.type=='pay'&&t.date==todayStr())sum+=t.amount})});return sum}
function collectedMonth(){var m=new Date().toISOString().slice(0,7);var sum=0;shops.forEach(function(s){s.tx.forEach(function(t){if(t.type=='pay'&&t.date.slice(0,7)==m)sum+=t.amount})});return sum}

function showView(v){document.querySelectorAll('.view').forEach(function(e){e.style.display='none'});document.getElementById('ledgerView').style.display='none';document.getElementById('view-'+v).style.display='block';document.querySelectorAll('.navBtn').forEach(function(b){b.classList.remove('active')});document.getElementById('nav-'+v).classList.add('active');render();}
function render(){renderHome();renderShops();renderReports();renderSettings();}
function renderHome(){
var tot=0;shops.forEach(function(s){tot+=total(s)});
var debtShops=shops.filter(function(s){return total(s)>0}).length;
document.getElementById('view-home').innerHTML='<div class="card"><b>ملخص اليوم</b><div class="small">شوف وضعك دغري بلا ما تفوت محل محل</div><div style="margin-top:14px"><div class="small">مجموع الديون على كل المحلات</div><div class="big">'+fmt(tot)+' ل.ل.</div></div><div class="row"><div class="card" style="flex:1;margin:8px 0"><div class="small">قبضت اليوم</div><b>'+fmt(collectedToday())+'</b></div><div class="card" style="flex:1;margin:8px 0"><div class="small">قبضت هالشهر</div><b>'+fmt(collectedMonth())+'</b></div></div><div class="small">عدد المحلات يلي عليها مصاري: '+debtShops+' من '+shops.length+'</div><button class="goldBig" onclick="openPlus()">+ سجل دين او دفعة بسرعة</button></div><div class="card"><b>يلي عليه اكتر</b>'+shops.slice().sort(function(a,b){return total(b)-total(a)}).slice(0,3).map(function(s){return '<div class="tx"><span>'+s.name+'</span><b>'+fmt(total(s))+'</b></div>'}).join('')+'</div>';
}
function renderShops(){
var h='';
shops.forEach(function(s){
h+='<div class="card"><b>'+s.name+'</b><div class="small">عليه: '+fmt(total(s))+' ل.ل. | '+(s.phone||'بلا رقم')+'</div><div class="row"><button class="btn btn-white" onclick="openEditShop(\''+s.id+'\')">✏️ عدّل</button><button class="btn btn-blue" onclick="openLedger(\''+s.id+'\')">📖 افتح الدفتر</button></div><div class="small" style="margin-top:8px;cursor:pointer" onclick="openLedger(\''+s.id+'\')">كبس لتفتح الدفتر ←</div></div>';
});
h+='<button class="goldBig" onclick="openAddShop()">+ زيد محل جديد</button>';
document.getElementById('view-shops').innerHTML=h;
}
function renderReports(){
var sorted=shops.slice().sort(function(a,b){return total(b)-total(a)});
var max=Math.max(1,total(sorted[0]||{tx:[]}));
var h='<div class="card"><b>📊 التقارير</b><div class="small">مين عليه اكتر، ومين عم يدفع</div>';
sorted.forEach(function(s){h+='<div style="margin-top:12px"><div style="display:flex;justify-content:space-between"><span>'+s.name+'</span><b>'+fmt(total(s))+'</b></div><div class="bar"><div class="fill" style="width:'+(total(s)/max*100)+'%"></div></div></div>'});
h+='</div>';
document.getElementById('view-reports').innerHTML=h;
}
function renderSettings(){
document.getElementById('view-settings').innerHTML='<div class="card"><b>⚙️ الاعدادات</b><div class="small">حافظ على شغلك</div><button class="btn btn-blue" style="width:100%;margin-top:12px" onclick="backup()">📥 نسخة احتياطية - انسخها</button><button class="btn btn-white" style="width:100%;margin-top:8px" onclick="restore()">📤 استرجاع نسخة</button><button class="btn btn-red" style="width:100%;margin-top:8px" onclick="wipe()">🗑️ مسح كل البيانات</button><div class="small" style="margin-top:12px">البيانات محفوظة على تلفونك. اعمل نسخة احتياطية كل جمعة.</div></div>';
}
function openPlus(){document.getElementById('plusModal').classList.add('open')}
function closePlus(){document.getElementById('plusModal').classList.remove('open')}
function openForm(html){document.getElementById('formBox').innerHTML=html;document.getElementById('formModal').classList.add('open')}
function closeForm(){document.getElementById('formModal').classList.remove('open')}
function openAddShop(){openForm('<b>زيد محل جديد</b><input id="fName" placeholder="اسم المحل مثلا محل 11"><input id="fPhone" placeholder="رقم التلفون"><div class="row"><button class="btn btn-green" onclick="doAddShop()">حفظ</button><button class="btn btn-white" onclick="closeForm()">إلغاء</button></div>')}
function doAddShop(){var n=document.getElementById('fName').value.trim()||('محل '+(shops.length+1));shops.push({id:'shop'+Date.now(),name:n,phone:document.getElementById('fPhone').value,tx:[]});save();closeForm();showView('shops');}
function openEditShop(id){var s=shops.find(function(x){return x.id==id});openForm('<b>عدّل '+s.name+'</b><input id="fName" value="'+s.name+'"><input id="fPhone" value="'+(s.phone||'')+'" placeholder="رقم التلفون"><div class="row"><button class="btn btn-green" onclick="doEditShop(\''+id+'\')">حفظ</button><button class="btn btn-red" onclick="doDeleteShop(\''+id+'\')">حذف المحل</button><button class="btn btn-white" onclick="closeForm()">إلغاء</button></div>')}
function doEditShop(id){var s=shops.find(function(x){return x.id==id});s.name=document.getElementById('fName').value||s.name;s.phone=document.getElementById('fPhone').value;save();closeForm();render();}
function doDeleteShop(id){if(!confirm('اكيد بدك تحذف هالمحل؟'))return;shops=shops.filter(function(x){return x.id!=id});save();closeForm();render();}
function openQuickTx(type){var opts=shops.map(function(s){return '<option value="'+s.id+'">'+s.name+'</option>'}).join('');var title=type=='debt'?'سجل دين جديد':'سجل دفعة قبضتها';openForm('<b>'+title+'</b><select id="fShop">'+opts+'</select><input id="fAmount" type="number" placeholder="المبلغ بالليرة"><input id="fNote" placeholder="ملاحظة مثلا كعك"><input id="fDate" type="date" value="'+todayStr()+'"><div class="row"><button class="btn btn-green" onclick="doSaveTx(\''+type+'\')">حفظ</button><button class="btn btn-white" onclick="closeForm()">إلغاء</button></div>')}
function doSaveTx(type){var id=document.getElementById('fShop').value;var amt=parseInt(document.getElementById('fAmount').value||0);if(!amt){alert('حط المبلغ');return}var s=shops.find(function(x){return x.id==id});s.tx.push({type:type,amount:amt,note:document.getElementById('fNote').value,date:document.getElementById('fDate').value||todayStr()});save();closeForm();render();alert('تم الحفظ ✅')}
function openLedger(id){
var s=shops.find(function(x){return x.id==id});
document.querySelectorAll('.view').forEach(function(e){e.style.display='none'});
var lv=document.getElementById('ledgerView');lv.style.display='block';
var list=s.tx.slice().reverse().map(function(t){return '<div class="tx"><span>'+(t.type=='debt'?'📝 دين':'💰 دفعة')+' - '+(t.note||'')+'<br><span class="small">'+t.date+'</span></span><b style="color:'+(t.type=='debt'?'#e05252':'#1a9a5a')+'">'+(t.type=='debt'?'+':'-')+fmt(t.amount)+'</b></div>'}).join('')||'<div class="small">بعد ما في حركات لهالمحل</div>';
lv.innerHTML='<div class="card"><button class="btn btn-white" onclick="showView(\'shops\')">← رجوع</button><div style="margin-top:10px"><b style="font-size:20px">'+s.name+'</b><div class="small">الباقي عليه: '+fmt(total(s))+' ل.ل.</div></div><div class="row"><button class="btn btn-blue" onclick="openQuickTx(\'debt\')">+ دين</button><button class="btn btn-green" onclick="openQuickTx(\'pay\')">+ دفعة</button></div><div style="margin-top:14px">'+list+'</div></div>';
}
function backup(){var txt=JSON.stringify(shops);if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){alert('اننسخت النسخة ✅ الصقها بمكان آمن')})}else{prompt('انسخ هالنص:',txt)}}
function restore(){var t=prompt('الصق النسخة الاحتياطية هون:');if(!t)return;try{shops=JSON.parse(t);save();render();alert('تم الاسترجاع ✅')}catch(e){alert('النسخة مش صح')}}
function wipe(){if(confirm('اكيد بدك تمسح كل شي؟')){localStorage.removeItem('daftar_v3');location.reload()}}
render();showView('shops');
</script></body></html>
