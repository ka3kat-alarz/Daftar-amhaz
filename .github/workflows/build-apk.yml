name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --legacy-peer-deps
      - name: Prepare www (app files + local libraries)
        run: |
          rm -rf www && mkdir -p www/vendor
          cp index.html ledger.html shim.js firebase-config.js login_bg.jpg www/
          cp node_modules/firebase/firebase-app-compat.js node_modules/firebase/firebase-auth-compat.js node_modules/firebase/firebase-firestore-compat.js www/vendor/ || echo "firebase vendor files missing - app will use the CDN"
          cp node_modules/xlsx/dist/xlsx.full.min.js www/vendor/ || echo "xlsx vendor file missing - app will use the CDN"
          ls -R www
      - run: rm -rf android
      - run: npx cap add android
      - name: Set app icon (Book - stacked books)
        run: |
          for d in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do mkdir -p "$d"; cp icon.png "$d/ic_launcher.png"; cp icon.png "$d/ic_launcher_round.png"; done
          ls -R android/app/src/main/res/mipmap-xxxhdpi
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: daftar3-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
